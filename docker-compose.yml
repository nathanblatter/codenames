services:
  app:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/codenames
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KPI_API_KEY: ${KPI_API_KEY}
      FLIGHTDECK_URL: ${FLIGHTDECK_URL:-http://flightdeck:8080}
      FLIGHTDECK_INGEST_KEY: ${FLIGHTDECK_INGEST_KEY}
    networks:
      - default
      - flightdeck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

networks:
  flightdeck:
    external: true
    name: docker-services_default
